<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento
    </title>
</head>
<body style="font-family: Cambria;">
    <form align="center">
        <label for="preco">Preço à vista:</label>
        <input type="number" id="preco" name="preco" min="0" step="0.01" value="0.00"/>
        <br>
        <label for="parcelas">Número de parcelas:</label>
        <select id="parcelas" name="parcelas">
            <option value="1">1</option>
            <option value="3">3</option>
            <option value="5">5</option>
        </select>
        <br>
        <button type="button" onclick="calcular()">Enviar</button>
        <p>Valor total: <b>R$<span id="total"></span></b></p>
        <p>Valor de cada parcela: <b>R$<span id="valorParcela"></span></b></p>
    </form>
    <script>
        function calcular(){
            var preco = Number(document.getElementById("preco").value);
            var parcelas = Number(document.getElementById("parcelas").value);
            var total, valorParcela;
            if(parcelas == 1){
                total = preco;
                valorParcela = preco;
            } else if(parcelas == 3){
                total = preco * 1.1;
                valorParcela = total / 3;
            } else if(parcelas == 5){
                total = preco * 1.2;
                valorParcela = total / 5;
            }
            document.getElementById("total").innerHTML = total.toFixed(2);
            document.getElementById("valorParcela").innerHTML = valorParcela.toFixed(2);
        }
    </script>
</body>
</html>
